<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crucible IDE | Industrial Forge</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
    <link rel="stylesheet" href="ui/style.css">

</head>
<body>
    <div class="sidebar" id="mainSidebar">
        <div class="sidebar-tabs">
            <button id="tab-explorer" class="active" onclick="switchSidebar('explorer')">EXPLORER</button>
            <button id="tab-git" onclick="switchSidebar('git')">SOURCE CONTROL</button>
        </div>

        <div id="view-explorer" class="sidebar-view active">
            <div class="toolbar">
                <button onclick="goBack()" title="Back"><</button>
                    <button onclick="goForward()" title="Forward">></button>
                    <button onclick="goUp()" title="Parent Directory">^</button>
                    <button onclick="loadTree(currentDirectory)" title="Refresh Tree">⟳</button>
                </div>

                <div id="pathUI">
                    <div id="breadcrumb"></div>
                    <input type="text" id="manualPath" placeholder="Navigate to..." onkeydown="if(event.key==='Enter') loadTree(this.value)">
                </div>

                <div class="toolbar">
                    <button onclick="renameItem()" title="Rename Selection">REN</button>
                    <button onclick="deleteItem()" title="Delete Selection">DEL</button>
                    <button onclick="createNewFile()" title="New File">✚ FILE</button>
                    <button onclick="createNewFolder()" title="New Folder">✚ DIR</button>
                </div>

                <div id="searchContainer">
                    <div style="display: flex; gap: 4px;">
                        <input type="text" id="globalSearchInput" placeholder="GLOBAL GREP..." style="flex-grow: 1;" onkeydown="if(event.key==='Enter') runGlobalSearch()">
                        <button onclick="runGlobalSearch()">SCAN</button>
                    </div>
                    <div id="searchResults"></div>
                </div>

                <div id="fileList"></div>
            </div>

            <div id="view-git" class="sidebar-view">
                <div class="git-controls">
                    <button onclick="initGitRepo()" style="width: 100%; margin-bottom: 5px; color: #3498db;">INITIALIZE REPO (GIT INIT)</button>
                    <input type="text" id="commitMessage" placeholder="Commit message...">
                    <button onclick="commitChanges()" style="width: 100%; margin-top: 5px;">COMMIT</button>
                </div>

                <div class="toolbar" style="margin-top: 10px;">
                    <button onclick="gitAction('pull')" title="Pull from Remote">PULL ↓</button>
                    <button onclick="gitAction('push')" title="Push to Remote">PUSH ↑</button>
                    <button onclick="refreshGitStatus()" title="Refresh Status">⟳</button>
                </div>

                <div id="gitStatusList" class="git-list"></div>
            </div>

            <div id="view-history" class="sidebar-view">
                <div class="git-header">
                    <span>REVISION ARCHIVE</span>
                    <button onclick="clearRevisionLog()" title="Purge local temporal logs" style="padding: 2px 5px;">PURGE</button>
                </div>
                <div id="revisionList" class="git-list"></div>
            </div>
        </div>

        <div class="resizer-v" id="resizer-sb"></div>

        <div class="editor-container" style="display: flex; flex-direction: column;">
            <div class="controls">
                <button onclick="openSettings()" title="Preferences">⚙️ CONFIG</button>
                <button onclick="saveFile()">Save</button>
                <button id="formatToggle" onclick="toggleAutoFormat()">Auto-Format</button>
                <button onclick="shutdownCrucible()" style="color: #e74c3c; border-color: #e74c3c; margin-left: 15px;" title="Terminate System">⏻ EXIT</button>
                <button onclick="startIndexing()" title="Run Vector Indexer">Index Forge</button>

                <div id="statusBar">
                    <div id="shadowStatus" style="width: 10px; height: 10px; border-radius: 50%; background: #444; margin-right: 10px;"></div>
                    <div id="progressFill"></div>
                    <div id="statusText">
                        <span id="coreStatus">System Operational</span>
                        <span id="corePercent">0%</span>
                    </div>
                </div>
            </div>

            <div id="tabBar"></div>

            <div class="toolbar" style="margin: 0; border-bottom: 1px solid #1a1a1a; background: #050505; padding: 5px;">
                <button onclick="editor.undo()" title="Undo (Ctrl+Z)">↶ UNDO</button>
                <button onclick="editor.redo()" title="Redo (Ctrl+Y)">↷ REDO</button>
                <span style="width: 10px;"></span>
                <button onclick="editor.execCommand('find')" title="Find / Replace (Ctrl+F)">🔍 FIND</button>
                <button onclick="editor.toggleCommentLines()" title="Toggle Line Comment (Ctrl+/)">// COMMENT</button>
                <button onclick="triggerManualFormat()" title="Format Document">▤ FORMAT</button>
                <span style="width: 10px;"></span>
                <button onclick="toggleSplitView()" id="splitBtn" title="Toggle Dual-Buffer" class="active">◫ SPLIT</button>
                <button onclick="toggleTerminal()" id="termBtn" title="Toggle Terminal" class="active">🖵 TERM</button>
            </div>

            <div id="codeEditor" style="flex-grow: 1;"></div>
        </div>

        <div class="resizer-v" id="resizer-ed"></div>

        <div class="output-container" style="display: flex; flex-direction: column;">
            <div class="controls">
                <button onclick="togglePreview()" id="previewBtn" style="color: #3498db;">Preview</button>
                <input type="text" id="aiInput" placeholder="Forge Directives..." style="flex-grow: 1;">
                <button onclick="askAI()" id="execBtn">Execute</button>

                <div id="viewportControls" style="display: none; gap: 5px;">
                    <button onclick="setViewport('100%')">Desktop</button>
                    <button onclick="setViewport('768px')">Tablet</button>
                    <button onclick="setViewport('375px')">Mobile</button>
                    <button onclick="togglePreviewBackground()" style="color: #9b59b6;">BG Toggle</button>
                </div>

                <button onclick="runShadowTest()" id="verifyBtn" style="color: #f1c40f;">Verify</button>
                <button onclick="applyDiffMerge()" id="mergeBtn" style="color: #2ecc71;">Merge</button>
                <button id="wrapToggle" onclick="toggleWrap()" class="active">Wrap</button>
            </div>

            <div id="outputEditor" style="flex-grow: 1;"></div>
            <iframe id="previewFrame" style="display: none; flex-grow: 1; width: 100%; border: none; background: #fff;"></iframe>
        </div>


        <div class="modal-overlay" id="settingsModal" style="display: none;">
            <div class="modal-content settings-modal-content">
                <div class="settings-header">
                    <h3 style="margin: 0; color: var(--ui-text-bright); font-size: 14px; letter-spacing: 2px;">⚙️ SYSTEM PREFERENCES</h3>
                    <button class="close-btn" onclick="closeSettings()" style="background: transparent; border: none; color: var(--ui-text-dim); cursor: pointer;">✕</button>
                </div>

                <div class="settings-body">
                    <div class="settings-nav">
                        <button class="settings-tab-btn active" onclick="switchSettingsTab(event, 'pane-general')">Appearance</button>
                        <button class="settings-tab-btn" onclick="switchSettingsTab(event, 'pane-colors')">Color Vectors</button>
                        <button class="settings-tab-btn" onclick="switchSettingsTab(event, 'pane-git')">Git & Auth</button>
                    </div>

                    <div class="settings-panes">
                        <div id="pane-general" class="tab-pane active">
                            <h4 style="color: var(--ui-text-main); margin-top: 0; margin-bottom: 15px;">Core Environment</h4>

                            <div class="settings-row" style="margin-bottom: 15px; display: flex; gap: 10px;">
                                <div class="settings-group" style="flex: 1;">
                                    <label>Editor Theme</label>
                                    <select id="set-theme" onchange="toggleCustomThemeEditor()"></select>
                                </div>
                                <div class="settings-group" style="flex: 1;">
                                    <label>Project Workspace</label>
                                    <div style="display: flex; gap: 5px;">
                                        <input type="text" id="set-workspace" placeholder="/home/user/project" style="flex-grow: 1;">
                                        <button id="browse-btn" onclick="sendToShell('PICK_FOLDER', '')" style="display: none;">Browse</button>
                                    </div>
                                </div>
                            </div>

                            <div class="settings-row" style="margin-bottom: 15px; display: flex; gap: 10px;">
                                <div class="settings-group" style="flex: 1;">
                                    <label>Editor Font Size</label>
                                    <input type="number" id="set-ed-font" value="14" min="8" max="24">
                                </div>
                                <div class="settings-group" style="flex: 1;">
                                    <label>Terminal Font Size</label>
                                    <input type="number" id="set-tm-font" value="13" min="8" max="24">
                                </div>
                            </div>

                            <div class="settings-row" style="display: flex; flex-direction: row; align-items: center; gap: 15px;">
                                <div style="display: flex; align-items: center; gap: 5px;">
                                    <input type="checkbox" id="set-wordwrap" checked>
                                    <label style="margin: 0;">Word Wrap</label>
                                </div>
                            </div>
                        </div>

                        <div id="pane-colors" class="tab-pane">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                                <h4 style="color: var(--ui-text-main); margin: 0;">Custom Theme Engine</h4>
                                <div style="display: flex; gap: 5px;">
                                    <input type="text" id="customThemeName" placeholder="Theme Name..." style="padding: 4px 8px; font-size: 11px; width: 120px;">
                                    <button onclick="saveCustomThemeToDisk()" style="padding: 4px 10px; font-size: 11px; color: #2ecc71; border-color: #2ecc71; background: transparent; cursor: pointer;">Save Preset</button>
                                </div>
                            </div>

                            <div id="customThemeEditor" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                <div class="settings-group">
                                    <label>Base Core</label><input type="color" id="color-bg-base" value="#000000">
                                </div>
                                <div class="settings-group">
                                    <label>Panel BG</label><input type="color" id="color-bg-panel" value="#050505">
                                </div>
                                <div class="settings-group">
                                    <label>Surface BG</label><input type="color" id="color-bg-surface" value="#0a0a0a">
                                </div>
                                <div class="settings-group">
                                    <label>Hover BG</label><input type="color" id="color-bg-hover" value="#111111">
                                </div>
                                <div class="settings-group">
                                    <label>Dark Border</label><input type="color" id="color-border-dark" value="#1a1a1a">
                                </div>
                                <div class="settings-group">
                                    <label>Light Border</label><input type="color" id="color-border-light" value="#222222">
                                </div>
                                <div class="settings-group">
                                    <label>Dim Text</label><input type="color" id="color-text-dim" value="#444444">
                                </div>
                                <div class="settings-group">
                                    <label>Muted Text</label><input type="color" id="color-text-muted" value="#666666">
                                </div>
                                <div class="settings-group">
                                    <label>Main Text</label><input type="color" id="color-text-main" value="#888888">
                                </div>
                                <div class="settings-group">
                                    <label>Bright Text</label><input type="color" id="color-text-bright" value="#cccccc">
                                </div>
                                <div class="settings-group">
                                    <label>Accent Color</label><input type="color" id="color-accent" value="#569cd6">
                                </div>
                            </div>
                        </div>

                        <div id="pane-git" class="tab-pane">
                            <h4 style="color: var(--ui-text-main); margin-top: 0; margin-bottom: 5px;">Repository Credentials</h4>
                            <p style="color: var(--ui-text-dim); font-size: 11px; margin-top: 0; margin-bottom: 15px;">
                                Credentials are encrypted in the local vault upon saving.
                            </p>

                            <div class="settings-group" style="margin-bottom: 10px;">
                                <label>GitHub PAT (Authentication)</label>
                                <input type="password" id="set-pat" placeholder="ghp_...">
                            </div>

                            <div class="settings-group" style="margin-bottom: 15px;">
                                <label>Target Repository URL (Remote Origin)</label>
                                <input type="text" id="set-repo" placeholder="https://github.com/User/Repo.git">
                            </div>

                            <div class="settings-row" style="display: flex; gap: 10px;">
                                <div class="settings-group" style="flex: 1;">
                                    <label>Git Author Name</label>
                                    <input type="text" id="set-git-name" placeholder="John Doe">
                                </div>
                                <div class="settings-group" style="flex: 1;">
                                    <label>Git Author Email</label>
                                    <input type="text" id="set-git-email" placeholder="john@example.com">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="settings-footer">
                    <button onclick="closeSettings()" style="background: transparent; border: 1px solid var(--ui-border-dark); color: var(--ui-text-main); cursor: pointer; padding: 6px 12px;">Cancel</button>
                    <button onclick="saveSettings()" style="color: #2ecc71; border-color: #2ecc71; background: transparent; font-weight: bold; cursor: pointer; padding: 6px 12px;">Save Changes</button>
                </div>
            </div>
        </div>

        <script>
            if (typeof isShell !== 'undefined' && isShell) {
                const btn = document.getElementById('browse-btn');
                if (btn) btn.style.display = 'block';
            }
        </script>

        <div class="terminal-container">
            <div id="terminalBox"></div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ext-language_tools.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ext-searchbox.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/mode-csharp.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ext-beautify.js"></script>

        <!--//THE FOLLOWING MUST REMAIN "ui/themes.js"-->
        <!--//without the leading '/'. Or things will break.-->
        <script src="ui/themes.js"></script>
        <script src="ui/client_bridge.js"></script>
        <!--<script src="ui/script.js"></script>-->
        <script src="ui/js/globals.js"></script>
        <script src="ui/js/editor.js"></script>
        <script src="ui/js/filesystem.js"></script>
        <script src="ui/js/git.js"></script>
        <script src="ui/js/ai_core.js"></script>
        <script src="ui/js/settings.js"></script>
    </body>
</html>
